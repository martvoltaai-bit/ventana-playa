<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Ventana al mar</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #intro {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center;
      color: #fff; background: linear-gradient(#1b5c8f, #6fb6d9 60%, #e9d7ac);
    }
    #intro h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .5px; }
    #intro p { margin: 0; max-width: 320px; line-height: 1.45; font-size: 16px; opacity: .95; }
    #start {
      margin-top: 8px; padding: 16px 34px; font-size: 18px; border: 0; border-radius: 40px;
      background: #fff; color: #1b5c8f; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    #hint {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 5;
      padding: 10px 18px; border-radius: 20px; background: rgba(0,0,0,.55); color: #fff;
      font-size: 15px; display: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="intro">
    <h1>Ventana al mar</h1>
    <p>Tocá el botón, permití el uso de la cámara y apuntá a la ventana de la pared.</p>
    <button id="start">Abrir la ventana</button>
  </div>
  <div id="hint">Apuntá a la ventana 🪟</div>

  <script src="playa.js"></script>
  <script>
  // ---------- Arranque
  document.getElementById('start').addEventListener('click', () => {
    document.getElementById('intro').style.display = 'none';
    document.getElementById('hint').style.display = 'block';
    startAudio();
    const scene = document.querySelector('a-scene');
    const go = () => scene.systems['mindar-image-system'].start();
    if (scene.hasLoaded) go(); else scene.addEventListener('loaded', go);
  });
  </script>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity light="type: hemisphere; color: #cfe8ff; groundColor: #d9c28e; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; color: #fff1d6; intensity: 0.9" position="-1 1.2 1"></a-entity>

    <a-entity id="ventana" mindar-image-target="targetIndex: 0">
      <!-- Pared invisible con el hueco de la ventana (abertura: x -0.25..0.25, y -0.25..0.40) -->
      <a-box occluder position="0 2.7 -0.002"   width="10" height="4.6" depth="0.001"></a-box>
      <a-box occluder position="0 -2.625 -0.002" width="10" height="4.75" depth="0.001"></a-box>
      <a-box occluder position="-2.625 0.075 -0.002" width="4.75" height="0.65" depth="0.001"></a-box>
      <a-box occluder position="2.625 0.075 -0.002"  width="4.75" height="0.65" depth="0.001"></a-box>

      <!-- Espesor de la pared (jambas) -->
      <a-box position="-0.255 0.075 -0.06" width="0.01" height="0.65" depth="0.12" color="#efe6d6"></a-box>
      <a-box position="0.255 0.075 -0.06"  width="0.01" height="0.65" depth="0.12" color="#efe6d6"></a-box>
      <a-box position="0 0.405 -0.06" width="0.52" height="0.01" depth="0.12" color="#e6dccb"></a-box>
      <a-box position="0 -0.255 -0.06" width="0.52" height="0.01" depth="0.12" color="#f3ebdd"></a-box>

      <!-- Marco de madera en relieve (coincide con el dibujo impreso) -->
      <a-box position="0 0.415 0.012"   width="0.56" height="0.03" depth="0.024" color="#6e4628"></a-box>
      <a-box position="0 -0.265 0.012"  width="0.56" height="0.03" depth="0.024" color="#6e4628"></a-box>
      <a-box position="-0.265 0.075 0.012" width="0.03" height="0.71" depth="0.024" color="#6e4628"></a-box>
      <a-box position="0.265 0.075 0.012"  width="0.03" height="0.71" depth="0.024" color="#6e4628"></a-box>
      <a-box position="0 0.075 0.008"  width="0.016" height="0.65" depth="0.016" color="#7a5030"></a-box>
      <a-box position="0 0.15 0.008"   width="0.5" height="0.016" depth="0.016" color="#7a5030"></a-box>
      <!-- Alféizar -->
      <a-box position="0 -0.2975 0.025" width="0.6" height="0.035" depth="0.05" color="#e1d7c8"></a-box>

      <!-- La playa, detrás de la pared -->
      <a-entity beach></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const target = document.getElementById('ventana');
    const hint = document.getElementById('hint');
    target.addEventListener('targetFound', () => { hint.style.display = 'none'; fade(0.8); });
    target.addEventListener('targetLost',  () => { hint.style.display = 'block'; fade(0); });
  </script>
</body>
</html>
