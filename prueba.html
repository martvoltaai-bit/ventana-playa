<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventana al mar — prueba sin cámara</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    #info { position: fixed; top: 10px; left: 10px; z-index: 5; padding: 8px 12px; border-radius: 8px;
             background: rgba(0,0,0,.6); color: #fff; font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="info">Prueba sin cámara · arrastrá para mirar · W A S D para moverte · clic = sonido</div>
  <script src="playa.js"></script>
  <a-scene renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false" background="color: #cfc6b6">
    <a-entity position="0 0.05 0.75">
      <a-camera wasd-controls="acceleration: 2" look-controls="reverseMouseDrag: false" near="0.01"></a-camera>
    </a-entity>
    <a-entity light="type: hemisphere; color: #cfe8ff; groundColor: #d9c28e; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; color: #fff1d6; intensity: 0.9" position="-1 1.2 1"></a-entity>

    <a-entity id="ventana">
      <a-entity pared-foto position="0 0 -0.003"></a-entity>
      <!-- Pared invisible con el hueco de la ventana (abertura: x -0.25..0.25, y -0.25..0.40) -->
      <a-box occluder position="0 2.7 -0.002"   width="10" height="4.6" depth="0.001"></a-box>
      <a-box occluder position="0 -2.625 -0.002" width="10" height="4.75" depth="0.001"></a-box>
      <a-box occluder position="-2.625 0.075 -0.002" width="4.75" height="0.65" depth="0.001"></a-box>
      <a-box occluder position="2.625 0.075 -0.002"  width="4.75" height="0.65" depth="0.001"></a-box>

      <!-- Espesor de la pared (jambas) -->
      <a-box position="-0.255 0.075 -0.06" width="0.01" height="0.65" depth="0.12" color="#efe6d6"></a-box>
      <a-box position="0.255 0.075 -0.06"  width="0.01" height="0.65" depth="0.12" color="#efe6d6"></a-box>
      <a-box position="0 0.405 -0.06" width="0.52" height="0.01" depth="0.12" color="#e6dccb"></a-box>
      <a-box position="0 -0.255 -0.06" width="0.52" height="0.01" depth="0.12" color="#f3ebdd"></a-box>

      <!-- Marco de madera en relieve (coincide con el dibujo impreso) -->
      <a-box position="0 0.415 0.012"   width="0.56" height="0.03" depth="0.024" color="#6e4628"></a-box>
      <a-box position="0 -0.265 0.012"  width="0.56" height="0.03" depth="0.024" color="#6e4628"></a-box>
      <a-box position="-0.265 0.075 0.012" width="0.03" height="0.71" depth="0.024" color="#6e4628"></a-box>
      <a-box position="0.265 0.075 0.012"  width="0.03" height="0.71" depth="0.024" color="#6e4628"></a-box>
      <a-box position="0 0.075 0.008"  width="0.016" height="0.65" depth="0.016" color="#7a5030"></a-box>
      <a-box position="0 0.15 0.008"   width="0.5" height="0.016" depth="0.016" color="#7a5030"></a-box>
      <!-- Alféizar -->
      <a-box position="0 -0.2975 0.025" width="0.6" height="0.035" depth="0.05" color="#e1d7c8"></a-box>

      <!-- La playa, detrás de la pared -->
      <a-entity beach></a-entity>
    </a-entity>
  </a-scene>
  <script>
    document.body.addEventListener('click', () => { if (!audio) { startAudio(); fade(0.8); } }, { once: true });
  </script>
</body>
</html>
